apply plugin: 'com.android.application'

// Upload key for Play Console; keystore.properties and the keystore stay out of git.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'com.privatecalc.vault'
    compileSdk 36
    defaultConfig {
        applicationId 'com.privatecalc.vault'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        if (keystoreFile.exists()) release {
            storeFile file(keystore['storeFile'])
            storePassword keystore['storePassword']
            keyAlias keystore['keyAlias']
            keyPassword keystore['keyPassword']
        }
    }
    buildTypes {
        release { if (keystoreFile.exists()) signingConfig signingConfigs.release }
        // A debug build installs under its own application id, so testing it never touches the vault of an installed store build.
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
